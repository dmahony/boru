name: Release

# Automatic releases disabled (2026-08-05): the `push: tags: ["v*"]` trigger
# was removed so pushing a version tag no longer publishes a release. Releases
# now happen only via manual workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
        default: ""

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: boru-linux-x86_64
            binary: boru
            # Linux ships inline GStreamer playback.
            features: gui,video-playback
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: boru-windows-x86_64
            binary: boru.exe
            # Windows stays without GStreamer linking (WIN-FEAT-01 direction
            # b): undownloaded videos stream over local HTTP to the OS default
            # player. See the Build step comment.
            features: gui
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: boru-macos-aarch64
            binary: boru
            features: gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: |
          # Per-target features: Linux ships inline GStreamer playback
          # (video-playback).  Windows deliberately stays on --features gui
          # (WIN-FEAT-01, direction b): gstreamer-sys links import libraries,
          # so enabling video-playback would make boru.exe fail to start when
          # the runtime DLLs are missing.  Instead, undownloaded videos are
          # served over a local HTTP streaming server and opened in the OS
          # default player (VLC/browser); the reviewed GStreamer runtime is
          # still bundled beside the exe for gst-inspect capability detection
          # and a future dynamic-loading / delay-load build
          # (docs/video-runtime-packaging.md).
          cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }} --example boru

      - name: Fetch GStreamer MSVC runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Pin the reviewed GStreamer MSVC runtime.  scripts/package_windows.sh
          # ships only the curated plugin subset + runtime DLL closure
          # (scripts/gstreamer-windows-plugins.txt / -runtime.txt), and the
          # bundled version must match the manifests.
          curl -fL -o gstreamer-runtime.msi \
            "https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi"
          echo "66915d82adda34189703c36a5d2ef145d2e3afb7afc12c66fcf2ea506e2466d2  gstreamer-runtime.msi" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gstreamer-extract"
          msiexec //a gstreamer-runtime.msi //qn TARGETDIR="C:\\gstreamer-extract"
          echo "GSTREAMER_MSVC_ROOT=C:/gstreamer-extract/gstreamer/1.0/msvc_x86_64" >> "$GITHUB_ENV"

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Self-contained Windows package: boru.exe + Papirus icons +
            # reviewed GStreamer runtime + third-party notices + toolchain
            # runtime DLLs.  Icons are bundled by the script so the
            # exe-relative loader always resolves them (PAPIRUS-17).
            bash scripts/package_windows.sh \
              --exe "target/${{ matrix.target }}/release/examples/${{ matrix.binary }}" \
              --gst-root "$GSTREAMER_MSVC_ROOT" \
              --target "${{ matrix.target }}" \
              --out dist
            # package_windows.sh writes the zip + sha256 into --out; the
            # artifact name already matches for x86_64.  Rename defensively.
            for f in dist/boru-windows-*.zip*; do
              base=$(basename "$f")
              mv "$f" "$base"
            done
          else
            cp "target/${{ matrix.target }}/release/examples/${{ matrix.binary }}" dist/
            mkdir -p dist/assets/third_party
            cp -r assets/third_party/papirus dist/assets/third_party/papirus
            cd dist
            tar -czf "../${{ matrix.artifact }}.tar.gz" "${{ matrix.binary }}" assets/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Set release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.release_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            boru-linux-x86_64/boru-linux-x86_64.tar.gz
            boru-windows-x86_64/boru-windows-x86_64.zip
            boru-windows-x86_64/boru-windows-x86_64.zip.sha256
            boru-macos-aarch64/boru-macos-aarch64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
