# boru-layout.example.toml — Boru development layout overrides (BORU-LAYOUT-06)
#
# This file documents the `boru-layout.toml` dev layout override format. Copy
# it to your data dir as `boru-layout.toml` to change Boru's STRUCTURAL
# layout WITHOUT rebuilding or restarting:
#
#   Linux/macOS:   ~/.local/share/boru/boru-layout.toml
#   Windows:       %LOCALAPPDATA%\boru\boru-layout.toml
#   (or the directory printed by `cargo run` at startup / --data-dir)
#
# The file is watched while Boru is running (BORU-LAYOUT-06): every save is
# debounced (300 ms), parsed on a background thread, merged onto
# `LayoutConfig::default()` and applied to the live UI — the home screen
# rearranges without recompiling.
#
# Rules
# -----
# * ONLY structural layout values live here — section order/visibility,
#   grid/list modes, column counts, max content widths, padding/gaps, card
#   sizing, per-component placement and responsive breakpoints. Visual
#   styling (colours, typography, radii, icon sizes) stays in `boru-ui.toml`
#   (theme_config.rs). NEVER mix theme tokens into this file.
# * Networking, chat, file transfer, video, tunnel, lobby, room and
#   persistence behaviour are NEVER configured here.
# * Every key is optional. Missing keys/groups fall back to
#   `LayoutConfig::default()` (which reproduces today's layout exactly). An
#   empty file is valid.
# * Only validated layouts are applied. A malformed file is logged with a
#   line/column error and the last known-good layout is kept — invalid TOML
#   never crashes Boru or changes the UI.
# * The file may be deleted at any time — deleting it reloads the default
#   layout and startup never fails because of it.
# * Field names mirror the layout groups in `examples/iced_chat/layout.rs`
#   (home.max_content_width, home.section_order, component.video_card.*, …).
#
# Units / ranges
# --------------
# * Lengths, sizes, widths, padding, gaps, breakpoints: pixels (px),
#   positive floats; 0 is allowed for padding/gaps/radii-style values.
#   Values far outside the current defaults (negative padding, absurd
#   widths, zero column counts) are clamped or fall back to the default and
#   logged as developer warnings.
# * `home.quick_actions.columns_*` and `responsive.home_columns`:
#   integer column counts (>= 1).
# * `home.grid.main_portion` / `rail_portion`, `chat.member_list.name_portion`
#   / `role_portion`: integer FillPortion splits (>= 1).
# * `chat.bubble_width_ratio`: fraction 0..=1 of the timeline width.
# * Enum values are the Rust variant names as strings:
#     mode = "Grid" | "List"
#     section_order = ["Hero", "MeshHealth", "QuickActions", "PeopleActivity", "Tunnels"]
#     hidden_sections = ["Tunnels"]
#     thumbnail_position = "Left" | "Right" | "Top" | "Bottom" | "Hidden"
#     metadata_alignment = "Start" | "Center" | "End"
#     button_placement = "Below" | "Overlay" | "Side"
#     card_orientation = "Horizontal" | "Vertical"
#     composer button_order = ["Attach", "Folder", "Gif", "Emoji", "Send"]
#
# The values below are the CURRENT BASELINE (they reproduce the default UI).
# Override only what you want to change; leave the rest commented or absent.
#
# Quick live-reload demo:
#   # copy this file to your data dir as boru-layout.toml, run Boru with the
#   # dev UI gate on (--dev-ui / BORU_DEV_UI=1), then uncomment a block and
#   # save — the home screen re-lays out within ~300 ms.

# ── Home dashboard (layout.rs::HomeLayout) ────────────────────────────
# Section order (vertical; left column then right rail in grid mode).
# [home]
# section_order = ["Hero", "MeshHealth", "QuickActions", "PeopleActivity", "Tunnels"]
# # Sections hidden entirely from the dashboard.
# hidden_sections = []
# # Grid (two-column dashboard) vs List (single stacked column).
# mode = "Grid"
# # Max dashboard canvas width (DASHBOARD_MAX_WIDTH = 1480 px).
# max_content_width = 1480.0
#
# [home.grid]
# main_portion = 2
# rail_portion = 1
# column_gap = 24.0
# stack_breakpoint = 720.0
#
# [home.quick_actions]
# columns_wide = 4
# columns_mid = 2
# columns_narrow = 1
# four_col_breakpoint = 1000.0
# two_col_breakpoint = 520.0
#
# [home.padding]
# top = 28.0
# bottom = 32.0
# horizontal_large = 32.0
# horizontal_default = 28.0
#
# [home.gaps]
# card_gap = 20.0
# hero_gap = 40.0
# header_dashboard_gap = 40.0
# footer_gap = 16.0
# compact_header_stack_gap = 12.0
#
# [home.card_sizing]
# peers_body_min = 128.0
