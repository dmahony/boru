# ── Responsive (layout.rs::ResponsiveLayout, PDF Task 4) ───────────────
# Viewport tiers: Narrow (< narrow_max_width), Desktop (between),
# UltraWide (>= ultra_wide_min_width).
# [responsive]
# viewport_ref_width = 1280.0
# viewport_ref_height = 800.0
# viewport_min_width = 1024.0
# viewport_min_height = 720.0
# viewport_lg_width = 1440.0
# viewport_lg_height = 900.0
# viewport_xl_width = 1920.0
# viewport_xl_height = 1080.0
# content_max_width = 720.0
# home_illustration_full_content = 720.0
# home_illustration_hide_content = 520.0
# home_compact_header_content = 560.0
# narrow_max_width = 360.0
# ultra_wide_min_width = 1440.0
#
# # Per-tier home dashboard column counts: narrow 1 (stacked), desktop 2
# # (main + rail), ultra-wide 2 (main + rail on a wider canvas).
# [responsive.home_columns]
# narrow = 1
# desktop = 2
# ultra_wide = 2
#
# # Per-tier home dashboard horizontal canvas padding.
# [responsive.home_padding_x]
# narrow = 28.0
# desktop = 28.0
# ultra_wide = 32.0

