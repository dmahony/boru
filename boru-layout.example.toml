# ── Component placement (layout.rs::ComponentLayout, PDF Task 5) ───────
# Per-component placement: thumbnail position, metadata alignment, button
# placement and card orientation. Each wired component keeps its own struct
# so one component can be rearranged without touching the others.
# [component]
# thumbnail_position = "Left"
# metadata_alignment = "Start"
# button_placement = "Below"
# card_orientation = "Horizontal"
#
# [component.video_card]
# thumbnail_position = "Top"
# metadata_alignment = "Start"
# button_placement = "Below"
# card_orientation = "Vertical"
#
# [component.shared_by_me]
# thumbnail_position = "Left"
# metadata_alignment = "Start"
# button_placement = "Side"
# card_orientation = "Horizontal"
#
# [component.video]
# narrow_breakpoint = 560.0
# medium_breakpoint = 780.0
# play_overlay_size = 64.0
# header_filename_max_width = 420.0
