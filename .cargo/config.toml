# Cargo aliases for boru-core examples
#
# Run with:  cargo chat open
#            cargo chat join <ticket>
#            cargo boru open
#            cargo boru join <ticket>
#

[alias]
chat = "run --features examples --example chat --"
# The GUI app is the `boru` [[bin]] target (see Cargo.toml); `cargo run`
# launches it directly (default-run = "boru").
boru = "run --features gui --"

# ── Edition note ─────────────────────────────────────────────────────────
#
# The project Cargo.toml sets edition = "2021".  Running `cargo build`,
# `cargo clippy`, etc. always passes the correct --edition.
#
# DO NOT run `clippy-driver src/foo.rs` directly on individual files — it
# defaults to **edition 2015** and produces misleading errors like:
#
#   error[E0670]: `async fn` is not permitted in Rust 2015
#
# Instead use:
#   cargo clippy               (correct edition, knows all dependencies)
#   ./scripts/lint.sh          (convenience wrapper)
#
# If you really need standalone clippy on a single file, pass --edition:
#   clippy-driver --edition 2021 src/foo.rs

# ── mold linker (x86_64 GNU/Linux) ────────────────────────────────────
# Use the mold linker for faster native debug/dev links.  Requires mold
# to be installed (`apt install mold` on Debian/Ubuntu); the distro
# package provides /usr/bin/ld.mold so gcc's -fuse-ld=mold resolves.
# Other targets keep their own linker settings (see below).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# ── Cross-compilation ──────────────────────────────────────────────────
# aarch64-unknown-linux-gnu (dragon — Radxa Dragon Q6A, Ubuntu arm64)
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# x86_64-pc-windows-gnullvm — use llvm-mingw clang (avoids MinGW export ordinal)
[target.x86_64-pc-windows-gnullvm]
linker = "/tmp/llvm-mingw-20260616-msvcrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-clang"
