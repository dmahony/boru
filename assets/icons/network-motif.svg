<svg xmlns="http://www.w3.org/2000/svg" width="220" height="150" viewBox="0 0 220 150" fill="none">
  <!-- Abstract peer-to-peer network motif: nodes connected by thin lines.
       Static decoration (no animation). Green palette from the Boru design
       tokens with low opacity so it never distracts from hero text. -->
  <g stroke="#188C50" stroke-opacity="0.22" stroke-width="1">
    <line x1="28" y1="104" x2="82" y2="44"/>
    <line x1="82" y1="44" x2="128" y2="92"/>
    <line x1="128" y1="92" x2="178" y2="38"/>
    <line x1="82" y1="44" x2="52" y2="18"/>
    <line x1="128" y1="92" x2="152" y2="128"/>
    <line x1="28" y1="104" x2="152" y2="128"/>
    <line x1="52" y1="18" x2="178" y2="38"/>
    <line x1="178" y1="38" x2="196" y2="102"/>
    <line x1="152" y1="128" x2="196" y2="102"/>
  </g>
  <g fill="#188C50">
    <circle cx="28" cy="104" r="4" fill-opacity="0.55"/>
    <circle cx="82" cy="44" r="6" fill-opacity="0.7"/>
    <circle cx="128" cy="92" r="4.5" fill-opacity="0.6"/>
    <circle cx="178" cy="38" r="5" fill-opacity="0.65"/>
    <circle cx="52" cy="18" r="3" fill-opacity="0.45"/>
    <circle cx="152" cy="128" r="4" fill-opacity="0.55"/>
    <circle cx="196" cy="102" r="3" fill-opacity="0.45"/>
  </g>
  <g fill="#20A661">
    <circle cx="82" cy="44" r="2" fill-opacity="0.9"/>
    <circle cx="178" cy="38" r="2" fill-opacity="0.9"/>
  </g>
</svg>
