[package]
name = "boru-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "boru_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.3", features = [] }
# Shared runtime integration is introduced through this local crate; keep the
# dependency feature-disabled until the Tauri command adapter is implemented.
boru-core = { path = "../..", default-features = false, optional = true }
