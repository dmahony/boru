[package]
name = "boru-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "boru_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
blake3 = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2.9.3", features = [] }
anyhow = "1"
iroh = { version = "1", default-features = false }
# Tauri owns the single production Boru runtime for the selected profile.
boru-core = { path = "../..", default-features = false, features = ["net"] }

[dev-dependencies]
tauri = { version = "2.9.3", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# This crate is its own workspace root, so Cargo ignores the patch set declared
# in the boru-core manifest and would resolve the crates.io releases instead.
# Registry `n0-mainline` pins `ed25519-dalek = "=3.0.0-rc.0"` while boru-core
# requires `^3.0.0`, an unresolvable prerelease/stable conflict unless the same
# vendored patches the root crate uses are declared here too.
[patch.crates-io]
iroh = { path = "../../patched/iroh" }
iroh-dns = { path = "../../patched/iroh-dns" }
iroh-relay = { path = "../../patched/iroh-relay" }
irpc = { path = "../../patched/irpc" }
mainline = { path = "../../patched/mainline" }
distributed-topic-tracker = { path = "../../patched/distributed-topic-tracker" }
n0-mainline = { path = "../../patched/n0-mainline" }
noq-udp = { path = "../../patched/noq-udp" }
p2panda-encryption = { path = "../../patched/p2panda-encryption" }
